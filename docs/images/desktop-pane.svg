<circle cx="52" cy="44" r="4" fill="#a3a29c"/><text x="66" y="48" fill="#ecebe7">checkout/applyCoupon.ts 를 읽었습니다. 쿠폰 할인은 장바구니 합계를</text><text x="66" y="70" fill="#a3a29c">계산한 뒤에 따로 적용됩니다.</text><text x="66" y="92" fill="#a3a29c">- 합계 계산과 쿠폰 적용이 서로 다른 요청으로 나갑니다.</text><text x="66" y="114" fill="#a3a29c">- 쿠폰 적용이 늦게 끝나면 그 사이에 결제가 진행될 수 있습니다.</text>
<rect x="48" y="572" width="652" height="104" rx="14" fill="#2a2927" stroke="#5c5a55" stroke-width="1.2"/><text x="68" y="600" fill="#ecebe7">결제 페이지에서 쿠폰 넣고 결제하면 가끔 할인 전 금액으로 결제되는 것 같아.</text><text x="68" y="621" fill="#ecebe7">저번에 본 그 파일 문제인 것 같은데 좀 봐줄 수 있어? 테스트도 있으면 좋고.</text><text x="68" y="642" fill="#ecebe7">think step by step</text><circle cx="670" cy="648" r="15" fill="#D97757"/><g transform="translate(662,640) scale(0.6667)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></g>
